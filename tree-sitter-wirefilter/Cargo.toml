[package]
name = "tree-sitter-wirefilter"
version = "0.1.0"
description = "Tree-sitter grammar for Cloudflare Wirefilter"
license = "MIT"
edition = "2021"
build = "bindings/rust/build.rs"
include = [
    "bindings/rust/**",
    "grammar.js",
    "queries/**",
    "src/**",
    "tree-sitter.json",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "=0.1.7"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "=0.26.12"
