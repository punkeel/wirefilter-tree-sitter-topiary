[package]
name = "wirefilter-formatter"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Keep the Rust bindings aligned with the wasm-bindgen-cli installed by the
# demo build (0.2.100).
wasm-bindgen = "=0.2.100"
wasm-bindgen-futures = "=0.4.50"
topiary-core = "=0.6.1"
topiary-tree-sitter-facade = "=0.6.1"
topiary-web-tree-sitter-sys = { version = "=0.6.1", features = ["web-sys"] }

[profile.release]
opt-level = "s"
lto = true
